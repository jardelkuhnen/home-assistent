services:

  # ─────────────────────────────────────────────
  # HOME ASSISTANT — core da automação
  # ─────────────────────────────────────────────
  homeassistant:
    container_name: homeassistant
    image: ghcr.io/home-assistant/home-assistant:stable
    restart: unless-stopped
    privileged: true
    environment:
      - TZ=America/Sao_Paulo
    volumes:
      - ./config/homeassistant:/config
    ports:
      - "8123:8123"
    depends_on:
      - mosquitto
      - mariadb
    networks:
      - ha_network

  # ─────────────────────────────────────────────
  # MARIADB — banco de dados (histórico/recorder)
  # ─────────────────────────────────────────────
  mariadb:
    container_name: mariadb
    image: mariadb:11
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=homeassistant
      - MYSQL_USER=ha_user
      - MYSQL_PASSWORD=ha_password
    volumes:
      - ./data/mariadb:/var/lib/mysql
    networks:
      - ha_network

  # ─────────────────────────────────────────────
  # MOSQUITTO — broker MQTT para dispositivos IoT
  # ─────────────────────────────────────────────
  mosquitto:
    container_name: mosquitto
    image: eclipse-mosquitto:2
    restart: unless-stopped
    environment:
      - TZ=America/Sao_Paulo
    volumes:
      - ./config/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./data/mosquitto:/mosquitto/data
      - ./logs/mosquitto:/mosquitto/log
    ports:
      - "1883:1883"   # MQTT
      - "9001:9001"   # WebSocket
    networks:
      - ha_network

  # ─────────────────────────────────────────────
  # NODE-RED — automações visuais / flows
  # ─────────────────────────────────────────────
  nodered:
    container_name: nodered
    image: nodered/node-red:latest
    restart: unless-stopped
    environment:
      - TZ=America/Sao_Paulo
    volumes:
      - ./data/nodered:/data
    ports:
      - "1880:1880"
    depends_on:
      - mosquitto
      - homeassistant
    networks:
      - ha_network

  # ─────────────────────────────────────────────
  # INFLUXDB — métricas de longo prazo
  # ─────────────────────────────────────────────
  influxdb:
    container_name: influxdb
    image: influxdb:2
    restart: unless-stopped
    environment:
      - TZ=America/Sao_Paulo
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=adminpassword
      - DOCKER_INFLUXDB_INIT_ORG=homeassistant
      - DOCKER_INFLUXDB_INIT_BUCKET=ha_metrics
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=my-super-secret-token
    volumes:
      - ./data/influxdb:/var/lib/influxdb2
    ports:
      - "8086:8086"
    networks:
      - ha_network

  # ─────────────────────────────────────────────
  # GRAFANA — dashboards e gráficos
  # ─────────────────────────────────────────────
  grafana:
    container_name: grafana
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      - TZ=America/Sao_Paulo
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=adminpassword
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - ./data/grafana:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - influxdb
    networks:
      - ha_network


networks:
  ha_network:
    driver: bridge
